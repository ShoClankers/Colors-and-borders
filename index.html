<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Border and container</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    </head>
    <body>
        <div class="container border border-dark">
            <h1>Gaming</h1>
            <p>Favourite game is Rocket League</p>
        </div>
        <div class="container p-3000 nb-300 bg-primary text white">
            <h1>Gaming</h1>
            <p>Favourite game is Rocket League</p>
        </div>
        <div class="container p-3 bg-danger text-white">
            <h1>My First Bootstrap Webpage</h1> <p> This container has a dark background with white text, border and some extra padding and the margin</p>
        </div>
    </body>
